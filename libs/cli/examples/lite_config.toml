# Example Deep Agents CLI Lite Mode Configuration
# Optimized for IBM Granite 4 Hybrid models
# Copy to ~/.deepagents/config.toml

# ============================================
# Model Configuration
# ============================================

[models]
# Default model to use
# Granite 4 350M is surprisingly capable for its size!
default = "openai:ibm/granite-4-350m-instruct"

# ============================================
# Lite Mode Configuration
# ============================================

[lite]
# Enable lite mode optimized for small language models
enabled = true

# That's it! Deep Agents will automatically detect the best 
# system prompt and toolset based on your model name.

# ============================================
# Manual Overrides (Optional)
# ============================================

# You can still explicitly configure prompts and tools if needed:

# system_prompt_path = "~/.deepagents/custom_prompt.md"

# Disable specific heavy tools
# disabled_tools = ["web", "mcp", "task"]

# OR Enable only specific categories
# enabled_tools = ["filesystem"]

# Categories: filesystem, search, shell, web, mcp, advanced

# ============================================
# Recommended Models
# ============================================
# - ibm/granite-4-350m-instruct
# - ibm/granite-4-1b-instruct
# - ibm/granite-4-3b-instruct
